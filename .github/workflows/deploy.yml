# Test -> build -> push -> deploy, gated top to bottom (docs/gcp-aws-deployment-proposal.md §7).
# A failure in `test` stops the pipeline — nothing builds or deploys.
#
# Auth is Workload Identity Federation (no long-lived key in GitHub Secrets):
# this repo's runs impersonate acamar-deployer@acamar-508716.iam.gserviceaccount.com,
# scoped by the `github-provider`'s attribute-condition to savadha2/acamar only.
#
# `api` deploys first (gets DATABASE_URL/COCKPIT_TOKEN from Secret Manager,
# the Cloud SQL Unix socket via --add-cloudsql-instances); dashboard/cockpit
# deploy after, pointed at api's real URL via --set-env-vars. All three are
# --allow-unauthenticated at the Cloud Run/IAM layer.
#
# api + dashboard also run with DISABLE_AUTH=true (2026-10-24, explicit
# user decision after being shown the tradeoff, not a default) -- the
# household dashboard's own bearer-token gate (api/auth.py) is OFF, so the
# dashboard's real data is reachable by anyone with the URL, no login.
# cockpit is NOT included -- its admin routes stay behind the separate
# cockpit_token check regardless of this setting (a different code path
# in api/auth.py, unaffected by disable_auth).
#
# OLLAMA_BASE_URL points at `ollama-embed` -- the project's private
# (no --allow-unauthenticated), CPU-only Ollama on Cloud Run, NOT deployed by
# this workflow (big static model image, provisioned by hand -- see
# ollama/Dockerfile). Cloud Run GPU quota was REJECTED (2026-10-24), so CPU is
# the real path until further notice. It serves nomic-embed-text (api) and,
# since 2026-10-24, llama3 for the ingestion jobs' enrichment.
#
# api + dashboard run with QUERY_ENABLED=false (2026-10-24, user decision):
# llama3 on Cloud Run CPU measured 156-225s per /query question (8 vCPU
# benchmark, 2026-10-24), so the chat bar is hidden and /query 503s.
# Local (bare-metal/docker compose) and scripts/run_eval.py's judge are
# unaffected -- they use the Mac's Metal Ollama. Re-enable = flip to true here
# once ollama-embed is on a GPU.
#
# Ingestion runs as 3 Cloud Run Jobs (gmail-school, faria-events,
# cupertino-events), started by Cloud Scheduler, created by hand once
# (runtime SA acamar-ingestion) -- this workflow only rolls their image.
# cupertino-events' trigger is PAUSED (2026-10-24): cupertino.gov's Akamai
# WAF 403s Cloud Run egress, so Cupertino stays on the local launchd job.

name: test-build-deploy

on:
  push:
    branches: [main]

env:
  PROJECT_ID: acamar-508716
  REGION: us-central1
  REPO: acamar # Artifact Registry repo

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/86020187429/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: acamar-deployer@acamar-508716.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: build + push all 4 targets, tagged by commit SHA
        run: |
          set -euo pipefail
          for target in api dashboard cockpit ingestion; do
            image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/$target:${{ github.sha }}"
            docker build --target "$target" -t "$image" .
            docker push "$image"
          done

      - name: deploy api
        run: |
          set -euo pipefail
          image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/api:${{ github.sha }}"
          gcloud run deploy api \
            --image="$image" \
            --region="${{ env.REGION }}" \
            --allow-unauthenticated \
            --add-cloudsql-instances="${{ env.PROJECT_ID }}:${{ env.REGION }}:acamar-db" \
            --set-secrets="DATABASE_URL=database-url:latest,COCKPIT_TOKEN=cockpit-token:latest" \
            --set-env-vars="DISABLE_AUTH=true,QUERY_ENABLED=false,OLLAMA_BASE_URL=https://ollama-embed-86020187429.us-central1.run.app" \
            --quiet

      - name: deploy dashboard + cockpit (need api's URL, so they deploy after it)
        run: |
          set -euo pipefail
          api_url=$(gcloud run services describe api --region="${{ env.REGION }}" --format="value(status.url)")

          dashboard_image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/dashboard:${{ github.sha }}"
          gcloud run deploy dashboard \
            --image="$dashboard_image" \
            --region="${{ env.REGION }}" \
            --allow-unauthenticated \
            --set-env-vars="API_BASE_URL=$api_url,DISABLE_AUTH=true,QUERY_ENABLED=false" \
            --quiet

          # MANUAL_MENU_SOURCE_ID pre-fills the Cockpit's "Source id" upload
          # field (dashboard doesn't need it -- it never uploads anything).
          cockpit_image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/cockpit:${{ github.sha }}"
          gcloud run deploy cockpit \
            --image="$cockpit_image" \
            --region="${{ env.REGION }}" \
            --allow-unauthenticated \
            --set-env-vars="API_BASE_URL=$api_url,MANUAL_MENU_SOURCE_ID=765248f6-2883-43be-801c-4ada9e0cf3ce" \
            --quiet

      - name: update the 3 ingestion Cloud Run Jobs' image
        run: |
          set -euo pipefail
          image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/ingestion:${{ github.sha }}"
          for job in gmail-school faria-events cupertino-events; do
            gcloud run jobs update "$job" --image="$image" --region="${{ env.REGION }}" --quiet
          done
