# Test -> build -> push -> deploy, gated top to bottom (docs/gcp-aws-deployment-proposal.md §7).
# A failure in `test` stops the pipeline — nothing builds or deploys.
#
# Auth is Workload Identity Federation (no long-lived key in GitHub Secrets):
# this repo's runs impersonate acamar-deployer@acamar-508716.iam.gserviceaccount.com,
# scoped by the `github-provider`'s attribute-condition to savadha2/acamar only.
#
# `api` deploys first (gets DATABASE_URL/COCKPIT_TOKEN from Secret Manager,
# the Cloud SQL Unix socket via --add-cloudsql-instances); dashboard/cockpit
# deploy after, pointed at api's real URL via --set-env-vars. All three are
# --allow-unauthenticated -- the real security boundary is the app's own
# bearer-token/cockpit_token checks (api/auth.py), matching how this already
# works bare-metal/local, not Cloud Run's own IAM-invoker layer.
#
# Known gap, not yet wired: OLLAMA_BASE_URL. Nothing points `api` at a real
# Ollama yet (GPU quota still ungranted as of 2026-10-24) -- DB-backed
# routes (dashboard, events/menu) work once this deploys; anything needing
# the LLM (/query, synthesis) won't until that's resolved. Tracked
# separately, not blocking this workflow.
#
# The ingestion-jobs update step still legitimately fails/warns until those
# Cloud Run Jobs exist (Day 4) -- expected, not a bug.

name: test-build-deploy

on:
  push:
    branches: [main]

env:
  PROJECT_ID: acamar-508716
  REGION: us-central1
  REPO: acamar # Artifact Registry repo

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/86020187429/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: acamar-deployer@acamar-508716.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: build + push all 4 targets, tagged by commit SHA
        run: |
          set -euo pipefail
          for target in api dashboard cockpit ingestion; do
            image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/$target:${{ github.sha }}"
            docker build --target "$target" -t "$image" .
            docker push "$image"
          done

      - name: deploy api
        run: |
          set -euo pipefail
          image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/api:${{ github.sha }}"
          gcloud run deploy api \
            --image="$image" \
            --region="${{ env.REGION }}" \
            --allow-unauthenticated \
            --add-cloudsql-instances="${{ env.PROJECT_ID }}:${{ env.REGION }}:acamar-db" \
            --set-secrets="DATABASE_URL=database-url:latest,COCKPIT_TOKEN=cockpit-token:latest" \
            --quiet

      - name: deploy dashboard + cockpit (need api's URL, so they deploy after it)
        run: |
          set -euo pipefail
          api_url=$(gcloud run services describe api --region="${{ env.REGION }}" --format="value(status.url)")
          for svc in dashboard cockpit; do
            image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/$svc:${{ github.sha }}"
            gcloud run deploy "$svc" \
              --image="$image" \
              --region="${{ env.REGION }}" \
              --allow-unauthenticated \
              --set-env-vars="API_BASE_URL=$api_url" \
              --quiet
          done

      - name: update the 2 ingestion Cloud Run Jobs' image
        run: |
          set -euo pipefail
          image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/ingestion:${{ github.sha }}"
          for job in gmail-school cupertino-events; do
            gcloud run jobs update "$job" --image="$image" --region="${{ env.REGION }}" --quiet \
              || echo "::warning::job $job not deployed yet (Day 4) — skipping, not failing the run"
          done
