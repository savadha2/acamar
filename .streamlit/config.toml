[theme]
# Pinned dark (2026-09-24, your call — dark is the preferred look here,
# the logo legibility issue that motivated trying light isn't something
# you need fixed). Still pinned rather than left to each viewer's OS
# setting, so it looks the same on every LAN device (iPad, laptop)
# regardless of that device's own dark/light preference.
base = "dark"

[server]
# Keep a session (and the dashboard sign-in in it) for 15 min after its
# browser connection drops, not Streamlit's default 2 min — a phone that
# locks or switches apps briefly shouldn't sign you out (2026-11-02).
disconnectedSessionTTL = 900
